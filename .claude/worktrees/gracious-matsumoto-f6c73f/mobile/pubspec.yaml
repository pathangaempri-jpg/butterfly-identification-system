name: butterfly_india
description: AI-powered butterfly identification platform for India.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'
  flutter: '>=3.19.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # ── State Management ──────────────────────────────────────────────────────
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # ── Navigation ────────────────────────────────────────────────────────────
  go_router: ^13.2.0

  # ── Networking ────────────────────────────────────────────────────────────
  dio: ^5.4.3
  pretty_dio_logger: ^1.3.1

  # ── Serialization / Code-gen ──────────────────────────────────────────────
  freezed_annotation: ^2.4.1
  json_annotation: ^4.9.0

  # ── Responsive ────────────────────────────────────────────────────────────
  responsive_framework: ^1.4.0
  flutter_screenutil: ^5.9.3

  # ── Secure Storage ────────────────────────────────────────────────────────
  flutter_secure_storage: ^9.2.2

  # ── Local Database (Drift / SQLite) ───────────────────────────────────────
  drift: ^2.18.0
  sqlite3_flutter_libs: ^0.5.24
  path_provider: ^2.1.3
  path: ^1.9.0

  # ── Image ─────────────────────────────────────────────────────────────────
  cached_network_image: ^3.3.1
  image_picker: ^1.1.2
  image: ^4.2.0

  # ── On-device AI (TFLite butterfly classifier) ─────────────────────────────
  tflite_flutter: ^0.12.0

  # ── Camera ────────────────────────────────────────────────────────────────
  camera: ^0.10.5+9

  # ── Connectivity ──────────────────────────────────────────────────────────
  connectivity_plus: ^6.0.3
  internet_connection_checker_plus: ^2.5.0

  # ── Maps (OpenStreetMap — free, no API key) ───────────────────────────────
  flutter_map: ^6.2.1
  latlong2: ^0.9.1

  # ── Location (GPS) ────────────────────────────────────────────────────────
  geolocator: ^12.0.0

  # ── Push Notifications ────────────────────────────────────────────────────
  firebase_core: ^3.1.1
  firebase_messaging: ^15.0.1

  # ── UI & Animations ───────────────────────────────────────────────────────
  shimmer: ^3.0.0
  flutter_animate: ^4.5.0
  lottie: ^3.1.2
  flutter_svg: ^2.0.10+1

  # ── Utilities ─────────────────────────────────────────────────────────────
  logger: ^2.3.0
  equatable: ^2.0.5
  dartz: ^0.10.1
  intl: ^0.20.2
  uuid: ^4.4.0
  collection: ^1.18.0
  rxdart: ^0.27.7
  shared_preferences: ^2.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter

  # ── Code Generation ───────────────────────────────────────────────────────
  build_runner: ^2.4.9
  freezed: ^2.5.2
  json_serializable: ^6.8.0
  riverpod_generator: ^2.4.3
  drift_dev: ^2.18.0
  # custom_lint and riverpod_lint pinned for SDK compatibility — enable when upgrading Flutter
  # custom_lint: ^0.7.0
  # riverpod_lint: ^2.4.0

  # ── Testing ───────────────────────────────────────────────────────────────
  mocktail: ^1.0.4
  golden_toolkit: ^0.15.0
  network_image_mock: ^2.1.1

  # ── Release tooling (Phase 14) ────────────────────────────────────────────
  # Drop a 1024x1024 PNG at assets/branding/app_icon.png and a transparent logo
  # at assets/branding/splash_logo.png, then run:
  #   dart run flutter_launcher_icons
  #   dart run flutter_native_splash:create
  flutter_launcher_icons: ^0.13.1
  flutter_native_splash: ^2.4.0

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/images/
    - assets/icons/
    - assets/lottie/
    - assets/animations/
    - assets/models/

  fonts:
    - family: PlayfairDisplay
      fonts:
        - asset: assets/fonts/PlayfairDisplay-Regular.ttf
        - asset: assets/fonts/PlayfairDisplay-Bold.ttf
          weight: 700
        - asset: assets/fonts/PlayfairDisplay-Italic.ttf
          style: italic
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter_18pt-Regular.ttf
        - asset: assets/fonts/Inter_18pt-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter_18pt-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter_18pt-Bold.ttf
          weight: 700

# ──────────────────────────────────────────────────────────────────────────────
# Launcher icon (flutter_launcher_icons)
# Provide a 1024x1024 PNG at the path below, then: dart run flutter_launcher_icons
# ──────────────────────────────────────────────────────────────────────────────
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/branding/app_icon.png"
  min_sdk_android: 21
  remove_alpha_ios: true
  # Adaptive icon for Android 8+ (foreground should be a transparent-padded PNG)
  adaptive_icon_background: "#1F6E5A"
  adaptive_icon_foreground: "assets/branding/app_icon_foreground.png"

# ──────────────────────────────────────────────────────────────────────────────
# Native splash (flutter_native_splash)
# Provide a transparent logo at the path below, then:
#   dart run flutter_native_splash:create
# ──────────────────────────────────────────────────────────────────────────────
flutter_native_splash:
  color: "#1F6E5A"
  image: "assets/branding/splash_logo.png"
  android_12:
    color: "#1F6E5A"
    image: "assets/branding/splash_logo.png"
  android: true
  ios: true
